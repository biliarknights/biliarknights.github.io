<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas烟花效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            display: block;
            background: #000;
        }
        
        .title {
            position: absolute;
            top: 20px;
            color: #fff;
            text-align: center;
            width: 100%;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #ff4da6, 0 0 20px #ff4da6;
            z-index: 10;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            color: #fff;
            text-align: center;
            width: 100%;
            font-size: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <h1 class="title">绚丽烟花秀</h1>
    <canvas id="canvas"></canvas>
    <div class="instructions">点击或拖动鼠标发射烟花</div>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 设置Canvas尺寸为窗口大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 存储烟花和粒子的数组
        const fireworks = [];
        const particles = [];
        
        // 颜色数组 - 烟花的可能颜色
        const colors = [
            '#ff0000', '#ff5e00', '#ffbb00', '#ffee00',
            '#a2ff00', '#00ff22', '#00ff88', '#00ffcc',
            '#00aaff', '#0044ff', '#8800ff', '#ff00cc'
        ];
        
        // 鼠标位置
        const mouse = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            down: false
        };
        
        // 烟花类
        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distance = Math.hypot(targetX - x, targetY - y);
                this.traveled = 0;
                this.speed = 10 + Math.random() * 5;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = {
                    x: Math.cos(this.angle) * this.speed,
                    y: Math.sin(this.angle) * this.speed
                };
                this.gravity = 0.2;
                this.hue = Math.floor(Math.random() * 360);
                this.brightness = Math.floor(Math.random() * 30 + 70);
                this.alpha = 1;
                this.trail = [];
                this.trailLength = 5;
                this.exploded = false;
            }
            
            update() {
                // 更新位置
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                // 应用重力
                this.velocity.y += this.gravity;
                
                // 计算已经飞行的距离
                this.traveled = Math.hypot(this.x - this.startX, this.y - this.startY);
                
                // 存储轨迹点
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
                
                // 检查是否到达目标位置或超过目标位置
                if (this.traveled >= this.distance * 0.9 || this.velocity.y > 0) {
                    this.explode();
                }
                
                // 淡出效果
                this.alpha -= 0.01;
                
                // 如果完全透明，则移除烟花
                if (this.alpha <= 0) {
                    const index = fireworks.indexOf(this);
                    if (index > -1) {
                        fireworks.splice(index, 1);
                    }
                }
            }
            
            explode() {
                if (this.exploded) return;
                this.exploded = true;
                
                // 创建爆炸粒子数量
                const particleCount = 50 + Math.floor(Math.random() * 100);
                
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        this.hue,
                        this.brightness
                    ));
                }
                
                // 从烟花数组中移除
                const index = fireworks.indexOf(this);
                if (index > -1) {
                    fireworks.splice(index, 1);
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                
                // 绘制轨迹
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i].x, this.trail[i].y);
                }
                
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 绘制烟花头部
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.fill();
            }
        }
        
        // 粒子类
        class Particle {
            constructor(x, y, hue, brightness) {
                this.x = x;
                this.y = y;
                this.velocity = {
                    x: (Math.random() - 0.5) * 10,
                    y: (Math.random() - 0.5) * 10
                };
                this.gravity = 0.05;
                this.resistance = 0.98;
                this.size = Math.random() * 2 + 1;
                this.hue = hue;
                this.brightness = brightness;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                // 更新位置
                this.velocity.x *= this.resistance;
                this.velocity.y *= this.resistance;
                this.velocity.y += this.gravity;
                
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                // 粒子逐渐消失
                this.alpha -= this.decay;
                
                // 如果完全透明，则移除粒子
                if (this.alpha <= 0) {
                    const index = particles.indexOf(this);
                    if (index > -1) {
                        particles.splice(index, 1);
                    }
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.fill();
            }
        }
        
        // 创建随机烟花
        function createRandomFirework() {
            const startX = Math.random() * canvas.width;
            const startY = canvas.height;
            const targetX = Math.random() * canvas.width;
            const targetY = Math.random() * canvas.height * 0.5;
            
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        }
        
        // 在鼠标位置创建烟花
        function createFireworkAt(x, y) {
            const startX = Math.random() * canvas.width;
            const startY = canvas.height;
            
            fireworks.push(new Firework(startX, startY, x, y));
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 创建半透明黑色背景，实现拖尾效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 随机生成烟花
            if (Math.random() < 0.03) {
                createRandomFirework();
            }
            
            // 更新和绘制所有烟花
            for (let i = 0; i < fireworks.length; i++) {
                fireworks[i].update();
                fireworks[i].draw();
            }
            
            // 更新和绘制所有粒子
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
        }
        
        // 事件监听
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        canvas.addEventListener('mousedown', () => {
            mouse.down = true;
        });
        
        canvas.addEventListener('mouseup', () => {
            mouse.down = false;
        });
        
        canvas.addEventListener('click', (e) => {
            createFireworkAt(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (mouse.down) {
                createFireworkAt(e.clientX, e.clientY);
            }
        });
        
        // 窗口大小改变时调整Canvas尺寸
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // 启动动画
        animate();
    </script>
</body>
</html>
